<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>モラシッター</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>モラシッター</strong>
    <span id="data-tag" class="demo-tag" hidden></span>
  </header>

  <section class="panel">
    <dl class="meta">
      <dt>閲覧中のドメイン</dt><dd id="host">—</dd>
      <dt>照合状態</dt><dd><span id="status" class="status">—</span></dd>
      <dt>照合日時</dt><dd id="checked-at">—</dd>
    </dl>
    <p id="status-note" class="note"></p>
  </section>

  <section id="demo-banner" class="panel demo-banner" hidden>
    <p><strong>架空デモを表示中</strong>：閲覧中のサイトとは無関係です。</p>
    <p>架空の店舗：<span id="demo-shop"></span></p>
  </section>

  <section id="incidents" class="panel" hidden>
    <h2>公表された事故（<span id="shop-name"></span>）</h2>
    <p id="kind-note" class="note" hidden></p>
    <ol id="incident-list"></ol>
  </section>

  <section class="panel actions">
    <button id="recheck" type="button">再確認</button>
  </section>

  <section class="panel">
    <h2>デモシナリオ</h2>
    <p class="note">選んだシナリオは、このタブだけに表示されます。ページを移動しても解除するまで続き、ほかのタブは通常の照合のままです。</p>
    <div class="demo-controls">
      <select id="scenario" aria-label="デモシナリオ"></select>
      <button id="apply-demo" type="button">このタブで表示</button>
      <button id="clear-demo" type="button" hidden>デモを解除</button>
    </div>
  </section>

  <footer class="note">公表情報と、その後に確認できた対応状況を示すものです。サイトの安全性を評価・保証するものではありません。</footer>

  <template id="incident-template">
    <li class="incident">
      <p class="summary"></p>
      <dl>
        <dt>公表日</dt><dd class="published-on"></dd>
        <dt>事故後の対応状況</dt><dd class="response"></dd>
        <dt>情報の確認日</dt><dd class="checked-on"></dd>
        <dt>出典</dt><dd class="source"></dd>
      </dl>
    </li>
  </template>
  <script type="module" src="popup.js"></script>
</body>
</html>
