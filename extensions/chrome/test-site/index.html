<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モラシッター拡張 ローカルテストページ</title>
<style>
body{margin:0;background:#f5f7f9;color:#1f2d3a;font:15px/1.7 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #d6dde4;border-radius:8px;padding:16px;margin:12px 0}
.host{font-size:22px;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #d6dde4;padding:6px;text-align:left;vertical-align:top}
code{background:#eef2f5;padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<main>
<h1>モラシッター拡張 ローカルテストページ</h1>
<div class="card">
  このページのホスト名：<span class="host" id="host"></span>
  <p>これは架空の店舗を想定したテストページです。実在の店舗・企業とは関係ありません。</p>
</div>
<div class="card">
<h2>リンクを開いて、拡張アイコンのバッジとポップアップを確認</h2>
<p>リンクは同じタブで開きます。新しいタブで開いて、タブを切り替える確認もできます。</p>
<table>
<thead><tr><th>リンク</th><th>想定される結果</th></tr></thead>
<tbody id="links"></tbody>
</table>
</div>
<div class="card">
<p><code>*.localhost</code> の名前は、Chrome がこのパソコン自身（127.0.0.1）に向けるため、hosts ファイルの変更や外部への通信は不要です。</p>
</div>
</main>
<script src="page.js"></script>
</body>
</html>
