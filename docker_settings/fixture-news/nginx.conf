server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    charset utf-8;

    location = /robots.txt {
        default_type text/plain;
    }

    location = /feed.xml {
        default_type application/atom+xml;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri =404;
    }
}
